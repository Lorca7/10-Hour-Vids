name: UI screenshots

on:
  push:
    branches: [claude/ui-screenshots]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release
      - name: Capture the interface
        run: .build/release/TenHourVids --screenshots shots
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: shots
          if-no-files-found: warn

      - name: Commit screenshots to docs/screenshots
        if: github.ref == 'refs/heads/claude/ui-screenshots'
        run: |
          mkdir -p docs/screenshots
          cp shots/*.png docs/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "Add UI screenshots captured on macOS 14" || exit 0
          git push
